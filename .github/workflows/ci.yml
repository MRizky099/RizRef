name: CI

# Minute budget first. The repository is private, so Actions minutes come out
# of a monthly quota where a Windows minute counts double and a macOS minute
# ten times. So:
#
# - One Linux job does everything that does not need the target OS: rustfmt,
#   clippy for Linux, Windows and both macOS architectures (the workspace is
#   pure Rust, so `cargo clippy --target` lints another OS without its SDK),
#   the native-code audit for every target, and the Linux tests.
# - The Windows and macOS test jobs run only when a pull request or push
#   touches code that behaves differently there (the platform layer, the
#   files with OS-specific branches, dependencies, this workflow), or on a
#   manual run with "full".
# - Intel macOS tests and the ten-minute fuzz soak run only on a manual
#   "full" run (before a release). There is no nightly schedule.
# - Documentation-only changes run nothing.
on:
  push:
    # Feature branches are covered by their pull request.
    branches: [main]
    paths-ignore: ["**.md", "LICENSE*", ".claude/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE*", ".claude/**"]
  workflow_dispatch:
    inputs:
      full:
        description: "Full run: Windows, both macOS and the 10-minute fuzz soak"
        type: boolean
        default: false

# A push that fixes a lint failure should not queue behind the run it fixes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which OS-specific jobs this change needs. A few seconds on Linux.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - "Cargo.lock"
              - "**/Cargo.toml"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
              - "crates/rizref/src/platform/**"
              - "crates/rizref/src/paths.rs"
              - "crates/rizref/src/recents.rs"
              - "crates/rizref/src/renderer.rs"
              - "crates/rizref/src/shortcuts.rs"
            windows:
              - *shared
              - "crates/rizref/build.rs"
              - "crates/rizref/resources.rs"
              - "packaging/**"
            macos:
              - *shared
              - "packaging/macos/**"

  # Everything a Linux runner can check, for every target.
  linux:
    name: lint, audit and test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      # Workspace lints live in the root Cargo.toml, so a lint failure here is a
      # policy failure, not a matter of taste. Each target lints its own
      # platform half (`crates/rizref/src/platform/{windows,unix,linux,macos}`).
      - name: Lint Linux
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint Windows
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Lint macOS (Apple Silicon)
        run: cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings
      - name: Lint macOS (Intel)
        run: cargo clippy --workspace --all-targets --target x86_64-apple-darwin -- -D warnings
      - name: Build the workspace
        run: cargo build --workspace
      - name: Run the tests
        run: cargo test --workspace
      # The pure-Rust rule is the one constraint that is easy to break by adding
      # a feature flag, and impossible to notice in review. The script checks the
      # `-sys` crates per target, the features that keep C out, and that no
      # build script left an object file behind.
      - name: Audit native code (all targets)
        shell: bash
        run: |
          scripts/audit-native.sh x86_64-unknown-linux-gnu target/debug/build
          for triple in x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            scripts/audit-native.sh "$triple" "target/$triple/debug/build"
          done

  windows:
    name: test (Windows)
    needs: changes
    if: needs.changes.outputs.windows == 'true' || inputs.full
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the tests
        run: cargo test --workspace

  macos:
    name: test (macOS, Apple Silicon)
    needs: changes
    if: needs.changes.outputs.macos == 'true' || inputs.full
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # The app bundle, .dmg and .zip are built by the release workflow only.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the tests
        run: cargo test --workspace

  # Intel is linted from Linux on every run; its tests run on a full run only
  # (a job-level condition, so no macOS runner starts otherwise).
  macos-intel:
    name: test (macOS, Intel)
    if: inputs.full
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the tests
        run: cargo test --workspace

  fuzz:
    name: fuzz (${{ matrix.target }})
    # The phase-03 soak: ten minutes per codec family, on a manual full run
    # (before a release) only.
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    strategy:
      # One crashing target must not hide the state of the others.
      fail-fast: false
      matrix:
        target:
          - decode_any
          - decode_png
          - decode_jpeg
          - decode_gif
          - decode_webp
          - decode_plain
          - decode_ico
          - decode_heif
          - markdown
    env:
      # The workspace pins stable in `rust-toolchain.toml`, and that directory
      # override beats the toolchain installed above — which is why fuzzing used
      # to fail with "the option `Z` is only accepted on the nightly compiler".
      # `RUSTUP_TOOLCHAIN` outranks the file and, unlike `cargo +nightly`, is
      # inherited by the `cargo build` child process cargo-fuzz spawns.
      RUSTUP_TOOLCHAIN: nightly
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          # cargo-fuzz builds inside `fuzz/`, not the workspace root.
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600 -print_final_stats=1
      # A crash writes its reproducer here; without the upload the only copy is
      # in the runner that gets torn down.
      - name: Keep crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
