name: CI

on:
  push:
    # Feature branches are covered by their pull request; running both would
    # double every check and the fuzz matrix with it.
    branches: [main]
  pull_request:
  # The phase-03 acceptance soak: ten minutes of fuzzing per codec family.
  # Pull requests get a short run so review stays fast.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# A push that fixes a lint failure should not queue behind the run it fixes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Phase 08: every check runs on the three release platforms. Ubuntu 22.04
  # is the glibc baseline the Linux build documents (2.35); macOS 15 is an
  # Apple Silicon runner (GitHub retired the macOS 14 image), and the Intel
  # half of the universal build is tested on macos-15-intel and
  # cross-checked from the arm64 runner (see the test job).
  fmt:
    name: rustfmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Workspace lints live in the root Cargo.toml, so a lint failure here is a
      # policy failure, not a matter of taste. Each OS lints its own platform
      # half (`crates/rizref/src/platform/{windows,unix,linux,macos}`).
      - name: Lint every target
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: macos-15
            triple: aarch64-apple-darwin
            # The Intel half of the universal macOS build (10.13+), also
            # checked by cross-compilation from the arm64 runner.
            cross: x86_64-apple-darwin
          - os: macos-15-intel
            triple: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cross || matrix.triple }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the workspace
        run: cargo build --workspace
      - name: Run the tests
        run: cargo test --workspace
      # The pure-Rust rule is the one constraint that is easy to break by adding
      # a feature flag, and impossible to notice in review. Catching it here is
      # cheaper than catching it in a released binary. The script checks the
      # `-sys` crates per target, the features that keep C out, and that no
      # build script left an object file behind.
      - name: Audit the dependency tree for native code
        shell: bash
        run: scripts/audit-native.sh ${{ matrix.triple }} target/debug/build
      - name: Cross-check ${{ matrix.cross }}
        if: matrix.cross
        run: cargo check --workspace --all-targets --target ${{ matrix.cross }}
      - name: Audit ${{ matrix.cross }}
        if: matrix.cross
        shell: bash
        run: scripts/audit-native.sh ${{ matrix.cross }} target/${{ matrix.cross }}/debug/build

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      # One crashing target must not hide the state of the others.
      fail-fast: false
      matrix:
        target:
          - decode_any
          - decode_png
          - decode_jpeg
          - decode_gif
          - decode_webp
          - decode_plain
          - decode_ico
          - decode_heif
          - markdown
    env:
      # The workspace pins stable in `rust-toolchain.toml`, and that directory
      # override beats the toolchain installed above — which is why fuzzing used
      # to fail with "the option `Z` is only accepted on the nightly compiler".
      # `RUSTUP_TOOLCHAIN` outranks the file and, unlike `cargo +nightly`, is
      # inherited by the `cargo build` child process cargo-fuzz spawns.
      RUSTUP_TOOLCHAIN: nightly
      RUST_BACKTRACE: "1"
      # Ten minutes per target on the schedule and on a manual dispatch (both are
      # the phase-03 soak, and a dispatch is how it gets re-run before a release);
      # one minute on a pull request.
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '600' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          # cargo-fuzz builds inside `fuzz/`, not the workspace root.
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ env.FUZZ_SECONDS }} -print_final_stats=1
      # A crash writes its reproducer here; without the upload the only copy is
      # in the runner that gets torn down.
      - name: Keep crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
