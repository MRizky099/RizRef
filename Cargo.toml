# RizRef — cargo workspace root.
#
# Layering (see README.md for the full picture):
#   rizref-core     scene model, geometry, commands — no IO, no UI, no windowing
#   rizref-format   the `.rizref` container — the only writer of scene files
#   rizref-codecs   image decode/encode dispatch on pure-Rust codec backends
#   rizref          the application binary: window, renderer, input, platform glue

[workspace]
resolver = "3"
members = [
    "crates/rizref",
    "crates/rizref-core",
    "crates/rizref-format",
    "crates/rizref-codecs",
]
# The fuzz crate needs a nightly toolchain and its own pinned dependencies; it
# is built by the dedicated CI job, never by `cargo test --workspace`.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/MRizky099/RizRef"

# ---------------------------------------------------------------------------
# Workspace dependencies.
#
# Pure-Rust rule: a dependency that vendors or links C/C++ is rejected. Win32 /
# COM FFI binding crates (`windows`, `windows-sys`) are the only accepted
# exception, because they contain nothing but declarations. `cargo tree` is
# audited for any other `*-sys` crate as part of the phase-00 verification.
#
# Every dependency is declared once here and opted into by a member with
# `dep.workspace = true`, so a version can never drift between crates.
# ---------------------------------------------------------------------------

[workspace.dependencies]

# --- maths and (de)serialization: rizref-core, rizref-format ----------------
glam = { version = "0.34.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# --- container internals: rizref-format ------------------------------------
lz4_flex = "0.14.0"
# `pure` selects BLAKE3's Rust-intrinsics implementation. Without it the build
# script assembles BLAKE3's hand-written C assembly whenever a C compiler is on
# PATH, which the pure-Rust rule does not allow. With `pure`, no C or assembly
# is compiled or linked into the binary; the build script still declares `cc` and
# probes one compiler flag on x86_64, which compiles nothing into our artifacts.
# See the dependency audit in README.md.
blake3 = { version = "1.8.7", features = ["pure"] }

# --- image codecs: rizref-codecs -------------------------------------------
png = "0.18.1"
zune-jpeg = "0.5.15"
jpeg-encoder = "0.7.1"
image-webp = "0.2.4"
gif = "0.14.2"
ico = "0.6.0"
# HEIF/HEIC in Rust: container + HEVC still-picture decoder, no C, no build
# script, `#![forbid(unsafe_code)]`, MIT OR Apache-2.0. `parallel` is off on
# purpose: the import pool already decodes one file per worker, and a nested
# rayon pool inside each of them would oversubscribe the machine.
heic-rs = { version = "0.1.4", default-features = false, features = ["std"] }
# `default-features = false` keeps the optional AVIF/rav1e, EXR and TIFF stacks
# out of the build; only the plain raster backends the decision table lists are
# enabled here. WebP and ICO are covered by `image-webp` and `ico` above.
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "pnm",
    "qoi",
    "tga",
] }

# --- window, GPU, clipboard, dialogs: rizref (bin) -------------------------
winit = "0.30.13"
# The import worker pool: std threads coordinated by bounded/unbounded MPMC
# channels. Pure Rust, no async runtime.
crossbeam-channel = "0.5.17"
# Backend order: Vulkan -> DX12 (see README.md); the Metal and WebGPU backends are
# switched off deliberately, and the GL fallback is dropped by decision rather than
# left ambiguous.
#
# `gles` is deliberately NOT enabled here: it pulls `glutin_wgl_sys`, an `-sys`
# crate outside the accepted `windows` family, which the pure-Rust rule does not
# allow (see the audit note in README.md). The pure-Rust answer for a machine with
# no usable Vulkan/DX12 driver is the CPU raster path (`tiny-skia`), not OpenGL.
wgpu = { version = "30.0.1", default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "vulkan",
    "wgsl",
] }
tiny-skia = "0.12.0"
# `fontconfig` is off: it is a C library, and RizRef reads the Windows font
# database through `fontdb`'s pure-Rust backends instead.
cosmic-text = { version = "0.19.0", default-features = false, features = [
    "std",
    "swash",
] }
# Clipboard text plus PNG/BMP image data. arboard already builds its own `image`
# dependency with `default-features = false`, so this does not pull rav1e in.
arboard = "3.7.0"
rfd = { version = "0.17.2", features = ["common-controls-v6"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Rolling daily log files (pure Rust). Retention is pruned by the application
# at startup, so no log-rotation service is involved.
tracing-appender = "0.2.3"
# Drives wgpu's async adapter/device requests to completion. wgpu 30 returns
# futures even on native; pollster is the smallest pure-Rust executor (no
# runtime, no dependencies).
pollster = "0.4.0"
# The Windows FFI surface, in one place so no crate has to guess a version:
# the single-instance mutex and args pipe, the panic message box, the native
# dialogs, and the OLE drop target (`IDropTarget`, CF_HDROP plus virtual files).
# The GDI/StructuredStorage/SystemServices/DataExchange/Memory features exist for
# the COM pieces: STGMEDIUM and ReleaseStgMedium, the IDropTarget vtable,
# RegisterClipboardFormatW and the HGLOBAL payloads.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The `#[implement]` macro expands to absolute `::windows_core::` paths, so a
# crate that implements a COM interface names the support crate directly. Pure
# Rust, no C, and version-locked to the `windows` release above.
windows-core = "0.62.2"

# ---------------------------------------------------------------------------
# Lint policy. Members opt in with `[lints] workspace = true`.
# `unsafe_code` is denied crate-wide; the phase-01 FFI glue modules that must
# call Win32 will carry a narrow, documented local `allow`.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The skeleton must not ship unfinished code paths.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# ---------------------------------------------------------------------------
# Release profile, sized against the phase-07 budget of a < 15 MB single exe.
# Budgets are recorded in README.md; phase 07 measures them.
# ---------------------------------------------------------------------------
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
