[package]
name = "rizref-thumb"
description = "Windows Explorer thumbnail provider (IThumbnailProvider) for `.rizref` boards."
version.workspace = true
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

# `cdylib` is the DLL Explorer loads; `rlib` lets the unit tests (and the
# registration code in the application) link the pure parts.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# One source of truth for the format: the DLL reads boards with the very crate
# that writes them.
rizref-format = { path = "../rizref-format" }
rizref-codecs = { path = "../rizref-codecs" }
windows.workspace = true
windows-core.workspace = true

[dev-dependencies]
rizref-core = { path = "../rizref-core" }
glam.workspace = true
