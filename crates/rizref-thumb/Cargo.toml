[package]
name = "rizref-thumb"
description = "Board thumbnails for `.rizref`: the Windows Explorer provider DLL (IThumbnailProvider) and the picture pipeline the Linux thumbnailer reuses."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

# `cdylib` is the DLL Explorer loads; `rlib` lets the unit tests (and the
# registration code in the application) link the pure parts.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# One source of truth for the format: the DLL reads boards with the very crate
# that writes them.
rizref-format = { path = "../rizref-format" }
rizref-codecs = { path = "../rizref-codecs" }

# The COM server (`src/com.rs`) is Windows-only; elsewhere the crate is the
# pure picture pipeline.
[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-core.workspace = true

[dev-dependencies]
rizref-core = { path = "../rizref-core" }
glam.workspace = true
