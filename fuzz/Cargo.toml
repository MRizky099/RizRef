[package]
name = "rizref-codecs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rizref-codecs = { path = "../crates/rizref-codecs" }
# The markdown target compiles the parser sources directly (the application
# crate is a binary); these are their dependencies, same versions as the
# workspace table.
pulldown-cmark = { version = "0.13.6", default-features = false }
csscolorparser = { version = "0.9.0", default-features = false, features = ["std", "named-colors"] }
tracing = "0.1.44"

[workspace]
# Deliberately its own workspace: the fuzz crate needs nightly, while the
# application builds on stable.

[[bin]]
name = "decode_any"
path = "fuzz_targets/decode_any.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_png"
path = "fuzz_targets/decode_png.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_jpeg"
path = "fuzz_targets/decode_jpeg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_gif"
path = "fuzz_targets/decode_gif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_webp"
path = "fuzz_targets/decode_webp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_plain"
path = "fuzz_targets/decode_plain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_ico"
path = "fuzz_targets/decode_ico.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_heif"
path = "fuzz_targets/decode_heif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false
