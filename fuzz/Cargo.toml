[package]
name = "rizref-codecs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rizref-codecs = { path = "../crates/rizref-codecs" }

[workspace]
# Deliberately its own workspace: the fuzz crate needs nightly, while the
# application builds on stable.

[[bin]]
name = "decode_any"
path = "fuzz_targets/decode_any.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_png"
path = "fuzz_targets/decode_png.rs"
test = false
doc = false
bench = false

